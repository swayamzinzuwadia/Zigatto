name: 🚀 Deploy Static Site to GitHub Pages

on:
  push:
    branches:
      - ZIG-19-react-frontend-login-home
      - ZIG-20-react-menu-cart-checkout
      - ZIG-21-frontend-backend-connect
      - ZIG-22-dockerize-react-frontend

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload Static Files
        uses: actions/upload-pages-artifact@v2
        with:
          path: .

      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@v2
